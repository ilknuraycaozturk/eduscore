name: Adres/Mahalle Türetme - Web Sitesinden (Aksiyon 1.7)

on:
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Bu çalıştırmada denenecek en fazla kurum sayısı"
        required: true
        default: "100"
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "true"
  # ÖNEMLİ: Her gün otomatik olarak 100 kurumluk bir parti dener - adresi
  # zaten olan kurumlar hızlıca atlanır, güvenlidir. 30 gün boyunca günlük
  # çalıştıktan sonra otomatik olarak AYLIĞA (her ayın 29'u) geçer.
  schedule:
    - cron: "0 7 * * *"  # Her gün 07:00 UTC (10:00 TR saati)

jobs:
  check_mode:
    runs-on: ubuntu-latest
    outputs:
      skip_today: ${{ steps.check.outputs.skip_today }}
    steps:
      - name: Mod ve gün kontrolü (sadece zamanlanmış çalıştırmalarda)
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip_today=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MODE=$(curl -s "$SUPABASE_URL/rest/v1/scrape_progress?key=eq.adres_schedule_mode&select=value" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['value'] if d else 'gunluk')")
          TODAY=$(date -u +%d)
          if [ "$MODE" = "aylik" ] && [ "$TODAY" != "29" ]; then
            echo "skip_today=true" >> "$GITHUB_OUTPUT"
            echo "Aylık moddayız ve bugün ayın 29'u değil - atlanıyor."
          else
            echo "skip_today=false" >> "$GITHUB_OUTPUT"
          fi

  derive:
    needs: check_mode
    if: needs.check_mode.outputs.skip_today != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Web sitesinden adres/mahalle türet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run || 'true' }}" = "true" ]; then
            python scripts/derive_address_from_website.py --max-batch "${{ inputs.max_batch || '100' }}" --dry-run
          else
            python scripts/derive_address_from_website.py --max-batch "${{ inputs.max_batch || '100' }}"
          fi

      - name: 30 gün dolduysa aylık moda geç
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STARTED=$(curl -s "$SUPABASE_URL/rest/v1/scrape_progress?key=eq.adres_mode_started_at&select=value" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['value'] if d else '')")
          DAYS=$(python3 -c "from datetime import date; print((date.today() - date.fromisoformat('$STARTED')).days)" 2>/dev/null || echo "0")
          if [ "$DAYS" -ge "30" ]; then
            curl -s -X PATCH "$SUPABASE_URL/rest/v1/scrape_progress?key=eq.adres_schedule_mode" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d '{"value": "aylik"}'
            echo "🎉 30 günlük yoğun tarama tamamlandı - otomatik olarak AYLIK moda geçildi (her ayın 29'u çalışacak)."
          fi
