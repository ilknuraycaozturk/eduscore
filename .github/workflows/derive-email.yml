name: E-posta Türetme - Web Sitesinden (Aksiyon 1.5)

on:
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Bu çalıştırmada denenecek en fazla kurum sayısı"
        required: true
        default: "100"
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "true"

jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Web sitesinden e-posta türet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/derive_email_from_website.py --max-batch "${{ inputs.max_batch }}" --dry-run
          else
            python scripts/derive_email_from_website.py --max-batch "${{ inputs.max_batch }}"
          fi
