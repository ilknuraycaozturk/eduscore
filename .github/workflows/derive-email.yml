name: E-posta Türetme - Web Sitesinden (Aksiyon 1.5)

on:
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Bu çalıştırmada denenecek en fazla kurum sayısı"
        required: true
        default: "100"
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "false"
  # ÖNEMLİ: Her gün otomatik olarak 100 kurumluk bir parti dener - e-postası
  # zaten olan kurumlar hızlıca atlanır, güvenlidir. 14 gün boyunca günlük
  # çalıştıktan sonra otomatik olarak AYA (her ayın 22'si) geçer.
  schedule:
    - cron: "0 6 * * *"  # Her gün 06:00 UTC (09:00 TR saati)

jobs:
  check_mode:
    runs-on: ubuntu-latest
    outputs:
      skip_today: ${{ steps.check.outputs.skip_today }}
    steps:
      - name: Mod ve gün kontrolü (sadece zamanlanmış çalıştırmalarda)
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip_today=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MODE=$(curl -s "$SUPABASE_URL/rest/v1/scrape_progress?key=eq.email_schedule_mode&select=value" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['value'] if d else 'gunluk')")
          TODAY=$(date -u +%m-%d)
          if [ "$MODE" = "yilda2" ] && [ "$TODAY" != "03-01" ] && [ "$TODAY" != "09-01" ]; then
            echo "skip_today=true" >> "$GITHUB_OUTPUT"
            echo "Yılda 2 kez moddayız ve bugün hedef tarih (1 Mart/1 Eylül) değil - atlanıyor."
          else
            echo "skip_today=false" >> "$GITHUB_OUTPUT"
          fi

  derive:
    needs: check_mode
    if: needs.check_mode.outputs.skip_today != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Web sitesinden e-posta türet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            python scripts/derive_email_from_website.py --max-batch "${{ inputs.max_batch || '100' }}" --dry-run
          else
            python scripts/derive_email_from_website.py --max-batch "${{ inputs.max_batch || '100' }}"
          fi

      - name: 14 gün dolduysa yılda 2 kez moda geç
        if: github.event_name == 'schedule'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STARTED=$(curl -s "$SUPABASE_URL/rest/v1/scrape_progress?key=eq.email_mode_started_at&select=value" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['value'] if d else '')")
          DAYS=$(python3 -c "from datetime import date; print((date.today() - date.fromisoformat('$STARTED')).days)" 2>/dev/null || echo "0")
          if [ "$DAYS" -ge "30" ]; then
            curl -s -X PATCH "$SUPABASE_URL/rest/v1/scrape_progress?key=eq.email_schedule_mode" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d '{"value": "yilda2"}'
            echo "🎉 30 günlük yoğun tarama tamamlandı - otomatik olarak YILDA 2 KEZ moda geçildi (her yıl 1 Mart ve 1 Eylül'de çalışacak)."
          fi
