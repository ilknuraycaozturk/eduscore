name: Tanı - dbtakip.com Sayfa Yapısı

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: dbtakip.com sayfa yapısını incele
        run: |
          mkdir -p data
          set +e
          python scripts/diagnose_dbtakip.py --output data/dbtakip_diagnose.json > out.log 2>&1
          rc=$?
          cat out.log
          # Ciktinin sonunu GitHub notu (annotation) olarak da yaz: run loglari
          # gelistirme ortamindan indirilemiyor, notlar ise API ile okunabiliyor.
          tail -c 3800 out.log | python3 -c "import sys;d=sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A');print('::notice title=diagnose_output::'+d)"
          exit $rc
      - name: Sonuçları artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: dbtakip-diagnose-result
          path: |
            data/dbtakip_diagnose.json
            data/dbtakip_page.html
          retention-days: 7
