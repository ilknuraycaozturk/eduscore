name: Tanı - dbtakip.com Sayfa Yapısı

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: dbtakip.com sayfa yapısını incele
        run: |
          mkdir -p data
          python scripts/diagnose_dbtakip.py --output data/dbtakip_diagnose.json
      - name: Sonuçları artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: dbtakip-diagnose-result
          path: |
            data/dbtakip_diagnose.json
            data/dbtakip_page.html
          retention-days: 7
