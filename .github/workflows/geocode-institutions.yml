name: Kurum konumlarını tamamla (LocationIQ)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Bu çalıştırmada en fazla kaç kurum (betik günlük toplamı her durumda 4.500 ile sınırlar)"
        required: true
        default: "4500"
      dry_run:
        description: "true ise veritabanına yazmaz"
        required: true
        default: "false"
      yontem:
        description: "ad: okul adıyla (bina düzeyi, güven orta); adres: kayıtlı adresle (güven düşük)"
        required: true
        default: "ad"
  # Günlük zamanlama, okul sitelerinden (meb.k12.tr) koordinat okuma işi
  # tamamlanana kadar kapalı; LocationIQ yalnızca sitesi olmayan kurumlar için.
  schedule:
    - cron: "17 1 * * *"  # 04:17 TR; yalnızca MEB sitesi olmayan kurumlar, adres yöntemi

# Aynı anda yalnızca bir çalıştırma (ücretsiz plan sınırı aşılmasın).
concurrency:
  group: geocode-locationiq
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Konumları tamamla
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        run: |
          ARGS="--limit ${{ inputs.limit || '4500' }} --yontem ${{ inputs.yontem || 'adres' }} --sadece-sitesiz"
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scripts/geocode_institutions.py $ARGS
