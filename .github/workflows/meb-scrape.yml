name: MEB Okul Verisi Çekme (Aksiyon 1.1)

on:
  workflow_dispatch:
    inputs:
      il_kodu:
        description: "İl plaka kodu (Ankara=6)"
        required: true
        default: "6"
      all_ilceler:
        description: "true ise ildeki TÜM ilçeleri otomatik keşfedip çeker (ilce_kodu/location_name/filter_mahalle görmezden gelinir)"
        required: true
        default: "false"
      ilce_kodu:
        description: "İlçe kodu (Etimesgut=27) - sadece all_ilceler=false iken kullanılır"
        required: false
        default: "27"
      location_name:
        description: "Supabase locations.name (örn. Etimesgut) - sadece all_ilceler=false iken kullanılır"
        required: false
        default: "Etimesgut"
      filter_mahalle:
        description: "Adres/isim filtresi (opsiyonel) - sadece all_ilceler=false iken kullanılır"
        required: false
        default: ""
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "true"
  schedule:
    - cron: "0 0 1 * *"

jobs:
  # ÖNEMLİ: Scraping ve Supabase'e yükleme artık İKİ AYRI İŞ (job).
  # Önceden tek bir işte birleşikti ve GitHub Actions'ın 6 saatlik iş
  # başına zaman sınırına takılıyordu (tüm Ankara için scraping ~4sa,
  # yükleme +2sa sürüyor, toplamda 6 saati aşıyordu). Ayrı işler her
  # birine kendi 6 saatlik hakkını verir (toplamda 12 saate kadar).
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: MEB verisini çek
        run: |
          if [ "${{ inputs.all_ilceler || 'false' }}" = "true" ]; then
            python scripts/scrape_meb_schools.py \
              --il-kodu "${{ inputs.il_kodu || '6' }}" \
              --all-ilceler \
              --output data/meb_raw.json
          else
            python scripts/scrape_meb_schools.py \
              --il-kodu "${{ inputs.il_kodu || '6' }}" \
              --ilce-kodu "${{ inputs.ilce_kodu || '27' }}" \
              --output data/meb_raw.json
          fi

      - name: Ham veriyi artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: meb-raw-data
          path: data/meb_raw.json
          retention-days: 7

  load:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r scripts/requirements.txt

      - name: Ham veriyi indir
        uses: actions/download-artifact@v4
        with:
          name: meb-raw-data
          path: data/

      - name: Supabase'e yükle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--input data/meb_raw.json"
          if [ "${{ inputs.all_ilceler || 'false' }}" != "true" ]; then
            ARGS="$ARGS --location-name \"${{ inputs.location_name || 'Etimesgut' }}\""
            FILTER="${{ inputs.filter_mahalle }}"
            if [ -n "$FILTER" ]; then
              ARGS="$ARGS --filter-mahalle \"$FILTER\""
            fi
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python scripts/load_to_supabase.py $ARGS
