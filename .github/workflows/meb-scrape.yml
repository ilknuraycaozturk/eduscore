name: MEB Okul Verisi Çekme (Aksiyon 1.1)

on:
  workflow_dispatch:
    inputs:
      il_kodu:
        description: "İl plaka kodu (Ankara=6)"
        required: true
        default: "6"
      ilce_kodu:
        description: "İlçe kodu (Etimesgut=27)"
        required: true
        default: "27"
      location_name:
        description: "Supabase locations.name (örn. Etimesgut)"
        required: true
        default: "Etimesgut"
      filter_mahalle:
        description: "Adres/isim filtresi (opsiyonel, boş bırakılırsa tüm ilçe alınır - isim bazlı filtre bazı okulları (örn. adında mahalle adı geçmeyenleri) kaçırabilir)"
        required: false
        default: ""
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "true"
  schedule:
    # Her ayın 1'i, gece yarısı (UTC) - yeni açılan okulları otomatik yakalamak için.
    # Zamanlanmış çalıştırmalarda workflow_dispatch inputları olmadığı için
    # aşağıdaki adımlarda '||' ile varsayılan değerler kullanılıyor.
    - cron: "0 0 1 * *"

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: MEB verisini çek
        run: |
          python scripts/scrape_meb_schools.py \
            --il-kodu "${{ inputs.il_kodu || '6' }}" \
            --ilce-kodu "${{ inputs.ilce_kodu || '27' }}" \
            --output data/meb_raw.json

      - name: Supabase'e yükle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--input data/meb_raw.json --location-name \"${{ inputs.location_name || 'Etimesgut' }}\""
          FILTER="${{ inputs.filter_mahalle }}"
          if [ -n "$FILTER" ]; then
            ARGS="$ARGS --filter-mahalle \"$FILTER\""
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python scripts/load_to_supabase.py $ARGS

      - name: Ham veriyi artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: meb-raw-data
          path: data/meb_raw.json
