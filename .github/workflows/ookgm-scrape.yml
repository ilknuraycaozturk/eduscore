name: ÖOKGM Özel Kurum Verisi Çekme (Aksiyon 1.2)

on:
  workflow_dispatch:
    inputs:
      il:
        description: "İl adı BÜYÜK HARF (örn. ANKARA); il_listesi doluysa boş bırakın"
        required: false
        default: ""
      il_listesi:
        description: "Virgülle ayrılmış il adları BÜYÜK HARF (örn. BAYBURT,TUNCELİ); birden çok il için"
        required: false
        default: ""
      tur:
        description: "kurs: özel kurslar / okul: özel okullar"
        required: true
        default: "kurs"
      filter_metin:
        description: "Adres/ilçe filtresi (opsiyonel, boş bırakılırsa TÜM il alınır)"
        required: false
        default: ""
      location_name:
        description: "Sabit tek konum (opsiyonel - pilot test için, örn. Bağlıca). Boş bırakılırsa her kayıt kendi ilçesine otomatik atanır (tüm il modu)."
        required: false
        default: ""
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "true"

concurrency:
  group: ookgm-${{ inputs.il_listesi || inputs.il }}
  cancel-in-progress: false

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r scripts/requirements.txt

      - name: ÖOKGM verisini çek
        run: |
          if [ -n "${{ inputs.il_listesi }}" ]; then
            ARGS="--il-listesi \"${{ inputs.il_listesi }}\""
          else
            ARGS="--il \"${{ inputs.il }}\""
          fi
          ARGS="$ARGS --tur \"${{ inputs.tur }}\" --output data/ookgm_raw.json"
          FILTER="${{ inputs.filter_metin }}"
          if [ -n "$FILTER" ]; then
            ARGS="$ARGS --filter-metin \"$FILTER\""
          fi
          eval python scripts/scrape_ookgm.py $ARGS

      - name: Supabase'e yükle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--input data/ookgm_raw.json"
          LOC="${{ inputs.location_name }}"
          if [ -n "$LOC" ]; then
            ARGS="$ARGS --location-name \"$LOC\""
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python scripts/load_ookgm_to_supabase.py $ARGS

      - name: Ham veriyi artifact olarak kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ookgm-raw-data
          path: |
            data/ookgm_raw.json
            data/ookgm_coverage.json
