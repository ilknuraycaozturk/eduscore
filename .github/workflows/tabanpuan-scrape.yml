name: LGS Taban Puanları - tabanpuanlari.net (Aksiyon 1.2)

on:
  workflow_dispatch:
    inputs:
      il:
        description: "İl adı (örn. Ankara). 'tumu' yazarsanız 81 ilin hepsi sırayla çekilir."
        required: true
        default: "tumu"
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "false"
  # ÖNEMLİ: Her gün otomatik olarak tüm Türkiye'yi (81 il) tekrar tarar -
  # script zaten "zaten var/aynı" kayıtları hızlıca atlayıp sadece yeni/
  # değişen verileri işlediği için (dedup + skor güncelleme mantığı), günlük
  # tekrar taramak güvenlidir ve LGS/YKS taban puanlarının güncel kalmasını
  # sağlar.
  schedule:
    - cron: "0 4 * * *"  # Her gün 04:00 UTC (07:00 TR saati) - MEB taramasından 1 saat sonra

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: tabanpuanlari.net'ten veri çek
        run: |
          if [ "${{ inputs.il }}" = "tumu" ]; then
            python scripts/scrape_tabanpuanlari.py --tumu --output data/tabanpuan_raw.json
          else
            python scripts/scrape_tabanpuanlari.py --il "${{ inputs.il }}" --output data/tabanpuan_raw.json
          fi

      - name: Ham veriyi artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tabanpuan-raw-data
          path: data/tabanpuan_raw.json
          retention-days: 7

  load:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r scripts/requirements.txt

      - name: Ham veriyi indir
        uses: actions/download-artifact@v4
        with:
          name: tabanpuan-raw-data
          path: data/

      - name: Supabase'e yükle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/load_tabanpuan_to_supabase.py --input data/tabanpuan_raw.json --dry-run
          else
            python scripts/load_tabanpuan_to_supabase.py --input data/tabanpuan_raw.json
          fi
