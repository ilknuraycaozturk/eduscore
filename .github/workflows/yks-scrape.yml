name: YKS Verisi - sinavizcisi.com Teşhis (Aksiyon 1.3)

on:
  workflow_dispatch:
    inputs:
      isimler:
        description: "Denenecek okul adları (virgülle ayrılmış)"
        required: true
        default: "Ankara Fen Lisesi,Ankara Lisesi,Ankara Anadolu Lisesi"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: sinavizcisi.com yapısını teşhis et
        run: |
          IFS=',' read -ra NAMES <<< "${{ inputs.isimler }}"
          python scripts/scrape_yks_sinavizcisi.py --isimler "${NAMES[@]}" --output data/yks_teshis.json

      - name: Ham veriyi artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: yks-teshis-data
          path: data/yks_teshis.json
          retention-days: 7
