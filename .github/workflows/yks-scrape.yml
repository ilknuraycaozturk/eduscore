name: YKS Verisi - sinavizcisi.com (Aksiyon 1.3)

on:
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Bu çalıştırmada işlenecek en fazla kurum sayısı"
        required: true
        default: "150"
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "false"
  # ÖNEMLİ: Her gün otomatik olarak 150 kurumluk bir parti işler - script
  # zaten skorlanmış kurumları hızlıca atladığı için güvenli, zamanla
  # tüm liseler kapsanmış olur.
  schedule:
    - cron: "0 5 * * *"  # Her gün 05:00 UTC (08:00 TR saati)

# ÖNEMLİ: Bu, aynı anda SADECE BİR çalıştırmaya izin verir. Yeni bir tetikleme
# (elle ya da otomatik zincirleme) gelirse, öncekinin bitmesini SIRAYLA bekler
# (cancel-in-progress: false) - bu, GitHub'ın "runner'lar dolu" tıkanıklığını
# ve aynı kayıtların birden fazla çalıştırma tarafından işlenmeye çalışılmasını
# önler.
concurrency:
  group: yks-scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  scrape_and_load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      kalan: ${{ steps.run_script.outputs.kalan }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: sinavizcisi.com'dan çek ve Supabase'e yükle
        id: run_script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/scrape_and_load_yks_sinavizcisi.py --max-batch "${{ inputs.max_batch }}" --dry-run
          else
            python scripts/scrape_and_load_yks_sinavizcisi.py --max-batch "${{ inputs.max_batch }}"
          fi

      - name: Kaldıysa kendini yeniden tetikle
        if: inputs.dry_run == 'false' && steps.run_script.outputs.kalan != '0'
        env:
          # ÖNEMLİ: Varsayılan GITHUB_TOKEN ile tetiklenen bir workflow, GitHub'ın
          # sonsuz döngü koruması nedeniyle BAŞKA bir workflow'u tetikleyemez.
          # Bu yüzden kişisel bir erişim anahtarı (Personal Access Token,
          # 'workflow' izniyle) kullanıyoruz - bu kısıtlamaya tabi değildir.
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          echo "Kalan kurum var (${{ steps.run_script.outputs.kalan }}), 2 dakika bekleniyor (siteye nefes payı için)..."
          sleep 120
          echo "Workflow yeniden tetikleniyor..."
          gh workflow run yks-scrape.yml \
            -f max_batch="${{ inputs.max_batch }}" \
            -f dry_run="false" \
            --repo ${{ github.repository }}
