name: YKS Verisi - sinavizcisi.com (Aksiyon 1.3)

on:
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Bu çalıştırmada işlenecek en fazla kurum sayısı"
        required: true
        default: "150"
      dry_run:
        description: "true ise Supabase'e yazmaz, sadece önizler"
        required: true
        default: "true"

jobs:
  scrape_and_load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: sinavizcisi.com'dan çek ve Supabase'e yükle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/scrape_and_load_yks_sinavizcisi.py --max-batch "${{ inputs.max_batch }}" --dry-run
          else
            python scripts/scrape_and_load_yks_sinavizcisi.py --max-batch "${{ inputs.max_batch }}"
          fi
