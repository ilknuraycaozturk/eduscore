<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduScor | Global Education Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FDF8F5] text-[#241A16] min-h-screen flex flex-col">

    <!-- Üst Menü -->
    <header class="w-full bg-white border-b border-slate-200 px-4 sm:px-10 py-4 flex flex-wrap justify-between items-center gap-y-2 shrink-0 z-10">
        <span class="text-xl font-bold text-[#E8543A]">EduScor</span>
        <div class="flex flex-wrap items-center gap-3 sm:gap-6 text-xs sm:text-sm font-semibold">
            <a href="index.html" class="text-[#8A7A72] hover:text-[#241A16] transition-colors">🏠 Ana Sayfa</a>
            <a href="lise-skoru.html" class="text-[#8A7A72] hover:text-[#241A16] transition-colors">🎓 Lise Skoru</a>
            <a href="tercih-sihirbazi.html" class="text-[#8A7A72] hover:text-[#241A16] transition-colors">🧭 Tercih Sihirbazı</a>
            <a href="edunode.html" class="text-[#8A7A72] hover:text-[#241A16] transition-colors">🕸️ EduNode</a>
            <a href="favorilerim.html" class="text-[#8A7A72] hover:text-[#241A16] transition-colors">★ Favorilerim</a>
            <a href="giris.html" class="px-4 py-1.5 bg-[#241A16] text-white hover:bg-[#E8543A] rounded-full transition-all text-xs whitespace-nowrap">Giriş Yap</a>
        </div>
    </header>

    <!-- Ana İçerik Konteynırı: mobilde normal akış (kaydırılabilir), masaüstünde sabit yükseklikli 2 sütun -->
    <div class="flex-grow flex flex-col md:flex-row w-full relative md:h-[calc(100vh-73px)] md:overflow-hidden">

        <!-- SOL SÜTUN (Liste) -->
        <main id="listContainer" class="w-full md:w-[60%] md:h-full md:overflow-y-auto p-4 pb-24 md:pb-6 md:p-6 bg-[#FDF8F5]">
            <!-- Arama Barı -->
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-4 flex flex-col gap-2">
                <div class="flex gap-2">
                    <input type="text" id="searchInput" class="w-full bg-transparent outline-none text-sm" placeholder="Kurum arayın...">
                    <button id="updateBtn" class="bg-[#E8543A] text-white px-4 py-1.5 rounded-lg text-xs font-bold">Ara</button>
                </div>
            </div>

            <div id="categoryChips" class="flex flex-wrap gap-2 mb-6"></div>
            <h2 id="resultsTitle" class="text-xs font-bold text-[#8A7A72] uppercase mb-4">Yükleniyor...</h2>
            
            <!-- Sonuç Listesi -->
            <div id="resultsList" class="space-y-4"></div>
            
            <div id="emptyState" class="hidden bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center">
                <p class="font-semibold">Sonuç bulunamadı</p>
                <p class="text-xs text-[#8A7A72]">Veritabanımız küresel ölçekte genişliyor, lütfen tekrar deneyin.</p>
            </div>
        </main>

        <!-- SAĞ SÜTUN (Harita) -->
        <aside id="mapContainer" class="hidden md:flex w-[40%] h-full border-l border-slate-200 bg-white">
            <div id="map" class="w-full h-full"></div>
        </aside>

    </div>

    <!-- Mobil Buton -->
    <button id="mobileToggleBtn" onclick="toggleMobileMap()" class="md:hidden fixed bottom-4 right-4 z-[9999] bg-[#241A16] text-white pl-3 pr-4 py-2 rounded-full shadow-xl font-bold text-xs whitespace-nowrap flex items-center gap-1.5">
        📍 Haritayı Göster
    </button>

    <script>
        const sb = supabase.createClient("https://piyxmmzteyygwlurdawi.supabase.co", "sb_publishable_6WIxgR9-dgumpgAFgZtn5A_iuBG8llL");
        let map, markersLayer, isMobileMap = false;

        const CATEGORIES = [
            ["okul-oncesi-k12", "Okul Öncesi & K-12"],
            ["yuksekogretim", "Yükseköğretim"],
            ["dil-egitimi", "Dil Eğitimi"],
            ["online-uzaktan", "Online & Uzaktan"],
            ["yetiskin-yasam-boyu", "Yetişkin & Yaşam Boyu"],
            ["ileri-yas", "İleri Yaş"],
            ["mesleki-teknik", "Mesleki & Teknik"],
            ["burs-finansman", "Burs & Finansman"],
            ["yaz-kisa-sureli", "Yaz & Kısa Süreli"],
            ["sertifika-programlari", "Sertifika Programları"],
            ["ozel-egitim-kapsayici", "Özel Eğitim & Kapsayıcı"],
            ["sanat-spor-hobi", "Sanat, Spor & Hobi"],
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const locParam = urlParams.get('loc') || '';
        const qParam = [locParam, urlParams.get('q') || ''].filter(Boolean).join(' ');
        const categoryParam = urlParams.get('category') || '';
        const userLat = urlParams.get('lat') ? parseFloat(urlParams.get('lat')) : null;
        const userLng = urlParams.get('lng') ? parseFloat(urlParams.get('lng')) : null;
        const radiusParam = urlParams.get('radius') ? parseFloat(urlParams.get('radius')) : null;

        document.getElementById('searchInput').value = qParam;

        function distanceKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function renderCategoryChips() {
            const chipsEl = document.getElementById('categoryChips');
            chipsEl.innerHTML = CATEGORIES.map(([slug, label]) => {
                const isActive = slug === categoryParam;
                const p = new URLSearchParams(window.location.search);
                p.set('category', slug);
                return `<a href="explorer.html?${p.toString()}" class="px-3 py-1.5 rounded-full text-xs font-semibold border transition-all ${
                    isActive ? 'bg-[#E8543A] text-white border-[#E8543A]' : 'bg-white border-slate-200 text-[#8A7A72] hover:border-[#E8543A] hover:text-[#E8543A]'
                }">${label}</a>`;
            }).join('');
        }

        function goSearch() {
            const q = document.getElementById('searchInput').value.trim();
            const p = new URLSearchParams();
            if (q) p.set('q', q);
            if (categoryParam) p.set('category', categoryParam);
            window.location.href = 'explorer.html' + (p.toString() ? '?' + p.toString() : '');
        }
        document.getElementById('updateBtn').addEventListener('click', goSearch);
        document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') goSearch(); });

        function initMap() {
            map = L.map('map').setView([39.90, 32.65], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        function toggleMobileMap() {
            const list = document.getElementById('listContainer');
            const mapC = document.getElementById('mapContainer');
            const btn = document.getElementById('mobileToggleBtn');
            
            isMobileMap = !isMobileMap;
            if(isMobileMap) {
                list.classList.add('hidden');
                mapC.classList.remove('hidden');
                mapC.style.display = 'block';
                btn.textContent = '📋 Listeyi Göster';
                map.invalidateSize();
            } else {
                list.classList.remove('hidden');
                mapC.classList.add('hidden');
                btn.textContent = '📍 Haritayı Göster';
            }
        }

        // Kırpılmayı tamamen önleyen esnek kart tasarımı
        function renderCardHTML(r) {
            const verifiedBadge = r.is_verified
                ? '<span class="bg-green-50 text-green-700 text-[10px] font-bold px-2 py-0.5 rounded">✓ Doğrulanmış</span>'
                : '<span class="bg-amber-50 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded">🔍 Taslak</span>';

            const ratingBadge = (r._rating && r._rating.review_count > 0)
                ? `<span class="bg-amber-50 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded">⭐ ${r._rating.avg_rating} (${r._rating.review_count})</span>`
                : `<span class="bg-slate-100 text-[#8A7A72] text-[10px] font-medium px-2 py-0.5 rounded italic">Henüz yorum yok</span>`;

            const extraBadges = [];
            if (r.age_min != null && r.age_max != null) extraBadges.push(`<span class="bg-slate-100 text-[#8A7A72] text-[10px] font-bold px-2 py-0.5 rounded">🎂 ${r.age_min}-${r.age_max}</span>`);
            if (r.class_size_avg) extraBadges.push(`<span class="bg-slate-100 text-[#8A7A72] text-[10px] font-bold px-2 py-0.5 rounded">👥 ${r.class_size_avg}</span>`);
            if (r.fee_info) extraBadges.push(`<span class="bg-slate-100 text-[#8A7A72] text-[10px] font-bold px-2 py-0.5 rounded">💰 ${r.fee_info}</span>`);

            const scores = r._scores || {};
            if (scores.akademik_basari != null) extraBadges.push(`<span class="bg-brandRed/10 text-brandRed text-[10px] font-bold px-2 py-0.5 rounded">🎓 LGS: ${scores.akademik_basari}</span>`);
            if (scores.universite_yerlestirme != null) extraBadges.push(`<span class="bg-brandRed/10 text-brandRed text-[10px] font-bold px-2 py-0.5 rounded">🏛️ YKS: ${scores.universite_yerlestirme}</span>`);
            if (scores.yabanci_dil != null) extraBadges.push(`<span class="bg-slate-100 text-[#8A7A72] text-[10px] font-bold px-2 py-0.5 rounded">🌐 Dil: ${scores.yabanci_dil}</span>`);

            const campusFacts = [];
            const ci = r.campus_info || {};
            if (ci.laboratuvar) campusFacts.push('🔬');
            if (ci.kapali_spor_salonu) campusFacts.push('🏀');
            if (ci.kütüphane) campusFacts.push('📚');
            if (ci.yemekhane) campusFacts.push('🍽️');

            return `
                <a href="okul-detay.html?id=${r.id}" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-col sm:flex-row gap-4 hover:border-brandRed/40 hover:shadow-md transition-all cursor-pointer">
                    <!-- Görsel Alanı: Mobilde genişlik tam, yükseklik resme göre otomatik (Kırpılma İmkansız). Masaüstünde standart kutu düzeni. -->
                    <div class="w-full sm:w-32 h-auto sm:h-24 bg-slate-50 rounded-xl flex items-center justify-center shrink-0 border border-slate-200/60 overflow-hidden">
                        <img src="students.jpg" alt="${r.name}" class="w-full h-auto sm:h-full sm:object-cover object-center" onerror="this.outerHTML='<span class="text-2xl">🏫</span>'">
                    </div>
                    <div class="flex-grow flex flex-col justify-between">
                        <div>
                            <div class="flex flex-wrap items-center gap-1.5 mb-1">
                                ${verifiedBadge}
                                ${ratingBadge}
                                ${extraBadges.join('')}
                                ${campusFacts.length ? `<span class="text-xs">${campusFacts.join(' ')}</span>` : ''}
                            </div>
                            <h3 class="font-bold text-base text-[#241A16]">${r.name}</h3>
                            <p class="text-xs text-[#8A7A72] mt-1">${r.address || r._ilAdi || 'Ankara'}</p>
                            ${(r._dist != null && isFinite(r._dist)) ? `<p id="dist-${r.id}" class="text-[11px] text-brandRed font-semibold mt-1">📏 ${r._dist.toFixed(1)} km (kuş uçuşu)</p>` : ''}
                        </div>
                        ${r.website ? `<a href="${r.website}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="text-[11px] text-brandRed hover:underline font-medium mt-1 inline-block">Web sitesi →</a>` : ''}
                    </div>
                </a>
            `;
        }

        async function loadResults() {
            let query = sb.from('institutions').select(`*, institution_types(name_tr), categories(slug), locations(name)`);

            // Kategori filtresini SUNUCU tarafında uyguluyoruz (önce id'yi bul)
            if (categoryParam) {
                const { data: catRow } = await sb.from('categories').select('id').eq('slug', categoryParam).maybeSingle();
                if (catRow) query = query.eq('category_id', catRow.id);
            }

            // Metin aramasını da sunucu tarafında uyguluyoruz (isim/adres üzerinde).
            // ÖNEMLİ: Standart ILIKE Türkçe ğ/ı/ş gibi harfleri doğru
            // eşleştirmediği için normalize edilmiş sütunları kullanıyoruz.
            if (qParam) {
                function trNormalize(s) {
                    if (!s) return '';
                    const map = { 'İ': 'i', 'I': 'i', 'ı': 'i', 'Ç': 'c', 'ç': 'c', 'Ğ': 'g', 'ğ': 'g', 'Ö': 'o', 'ö': 'o', 'Ş': 's', 'ş': 's', 'Ü': 'u', 'ü': 'u' };
                    return s.replace(/[İIıÇçĞğÖöŞşÜü]/g, c => map[c]).toLowerCase();
                }
                const qNorm = trNormalize(qParam);
                query = query.or(`name_normalized.ilike.%${qNorm}%,address_normalized.ilike.%${qNorm}%`);
            }

            // ÖNEMLİ: Supabase/PostgREST varsayılan olarak sorguyu 1000 satırla
            // sınırlıyor - 2500+ kurumumuz olduğu için filtresiz "Platformu Keşfet"
            // gibi durumlarda hem bu sınıra takılıyor hem de binlerce kartı aynı anda
            // render etmeye çalışıp yavaşlıyordu. Performans için makul bir üst sınır
            // koyuyoruz ve kullanıcıya bunu açıkça belirtiyoruz.
            const DISPLAY_LIMIT = 60;
            query = query.order('name').limit(DISPLAY_LIMIT);

            const { data, error } = await query;

            if (error) {
                document.getElementById('resultsTitle').textContent = 'Bir hata oluştu';
                console.error(error);
                return;
            }

            // ÖNEMLİ: Sonuç bulunamadıysa ve arama terimi bilinen bir MAHALLE
            // ile eşleşiyorsa (çoğu okulumuzda mahalle bilgisi yok, sadece
            // ilçe var), o mahallenin bağlı olduğu ilçedeki okulları geri
            // dönüş (fallback) olarak gösteriyoruz.
            let finalData = data;
            let mahalleUyarisi = null;
            if (qParam && (!finalData || finalData.length === 0)) {
                const qNorm2 = (function () {
                    const map = { 'İ': 'i', 'I': 'i', 'ı': 'i', 'Ç': 'c', 'ç': 'c', 'Ğ': 'g', 'ğ': 'g', 'Ö': 'o', 'ö': 'o', 'Ş': 's', 'ş': 's', 'Ü': 'u', 'ü': 'u' };
                    return qParam.replace(/[İIıÇçĞğÖöŞşÜü]/g, c => map[c]).toLowerCase();
                })();
                const { data: mahalleEslesme } = await sb.from('mahalle_ilce_eslesme')
                    .select('mahalle_adi, ilce_location_id, locations!mahalle_ilce_eslesme_ilce_location_id_fkey ( name )')
                    .ilike('mahalle_normalized', `%${qNorm2}%`)
                    .limit(1);
                if (mahalleEslesme && mahalleEslesme.length) {
                    let fallbackQuery = sb.from('institutions')
                        .select('id, name, is_public, is_verified, fee_info, locations ( name ), institution_types ( name_tr, slug ), categories ( slug )')
                        .eq('location_id', mahalleEslesme[0].ilce_location_id)
                        .order('name').limit(DISPLAY_LIMIT);
                    if (categoryParam) {
                        const { data: catRow2 } = await sb.from('categories').select('id').eq('slug', categoryParam).maybeSingle();
                        if (catRow2) fallbackQuery = fallbackQuery.eq('category_id', catRow2.id);
                    }
                    const { data: fallbackData } = await fallbackQuery;
                    if (fallbackData && fallbackData.length) {
                        finalData = fallbackData;
                        mahalleUyarisi = `"${qParam}" mahallesi için kesin eşleşme bulunamadı, bu mahallenin bağlı olduğu "${mahalleEslesme[0].locations.name}" ilçesindeki kurumlar gösteriliyor.`;
                    }
                }
            }
            let results = finalData || [];

            // Ortalama puanları ayrıca çekip (view, FK ilişkisi olmadığı için ayrı
            // sorgu gerekiyor) her kurumla eşleştiriyoruz
            if (results.length > 0) {
                const ids = results.map(r => r.id);
                const { data: ratings } = await sb.from('institution_ratings').select('institution_id, avg_rating, review_count').in('institution_id', ids);
                const ratingById = {};
                (ratings || []).forEach(r => { ratingById[r.institution_id] = r; });
                results = results.map(r => ({ ...r, _rating: ratingById[r.id] || null }));
            }

            // Kriter skorlarını (Akademik Başarı, Yabancı Dil, Üniversite Yerleştirme) çek
            if (results.length > 0) {
                const { data: scoreRows } = await sb.from('institution_criteria_scores')
                    .select('institution_id, score, scoring_criteria ( key )')
                    .in('institution_id', results.map(r => r.id));
                const scoresById = {};
                (scoreRows || []).forEach(sr => {
                    const key = sr.scoring_criteria ? sr.scoring_criteria.key : null;
                    if (!key) return;
                    if (!scoresById[sr.institution_id]) scoresById[sr.institution_id] = {};
                    scoresById[sr.institution_id][key] = sr.score;
                });
                results = results.map(r => ({ ...r, _scores: scoresById[r.id] || {} }));
            }

            // Gerçek il adını çek (ilçenin üst konumu) - "Ankara" sabit yazısı
            // yerine, tüm Türkiye'yi kapsayan doğru il adını göstermek için.
            if (results.length > 0) {
                const locIds = [...new Set(results.map(r => r.location_id).filter(Boolean))];
                const { data: districts } = await sb.from('locations').select('id, parent_id').in('id', locIds);
                const parentIds = [...new Set((districts || []).map(d => d.parent_id).filter(Boolean))];
                const { data: provinces } = parentIds.length
                    ? await sb.from('locations').select('id, name').in('id', parentIds)
                    : { data: [] };
                const provinceById = {};
                (provinces || []).forEach(p => { provinceById[p.id] = p.name; });
                const districtToProvince = {};
                (districts || []).forEach(d => { districtToProvince[d.id] = provinceById[d.parent_id] || null; });
                results = results.map(r => ({ ...r, _ilAdi: districtToProvince[r.location_id] || 'Ankara' }));
            }

            if (userLat && userLng) {
                results = results
                    .map(r => ({ ...r, _dist: (r.lat && r.lng) ? distanceKm(userLat, userLng, r.lat, r.lng) : Infinity }))
                    .sort((a, b) => a._dist - b._dist);

                if (radiusParam) {
                    results = results.filter(r => r._dist <= radiusParam);
                }
            }

            const radiusNotice = (userLat && userLng && radiusParam)
                ? ` <span class="text-brandRed">(${radiusParam} km içinde)</span>`
                : '';

            const noFilterAtAll = !categoryParam && !qParam;
            document.getElementById('resultsTitle').innerHTML = (noFilterAtAll
                ? `Öne Çıkan Kurumlar (ilk ${results.length})`
                : `Arama Sonuçları (${results.length}${results.length === DISPLAY_LIMIT ? '+' : ''} kurum)`) + radiusNotice;

            if (mahalleUyarisi) {
                const existing = document.getElementById('mahalleUyariBox');
                if (existing) existing.remove();
                const box = document.createElement('p');
                box.id = 'mahalleUyariBox';
                box.className = 'text-[11px] text-amber-700 bg-amber-50 rounded-lg px-3 py-2 mb-3';
                box.textContent = '💡 ' + mahalleUyarisi;
                document.getElementById('resultsTitle').insertAdjacentElement('afterend', box);
            }

            const listEl = document.getElementById('resultsList');
            const emptyEl = document.getElementById('emptyState');
            if (results.length > 0) {
                emptyEl.classList.add('hidden');
                listEl.innerHTML = results.map(renderCardHTML).join('');
                if (userLat && userLng) enhanceWithRealTravelTime(results.slice(0, 12));
            } else {
                listEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
            }

            markersLayer.clearLayers();
            results.forEach(r => { if (r.lat && r.lng) L.marker([r.lat, r.lng]).addTo(markersLayer).bindPopup(`<b>${r.name}</b>`); });
            if (userLat && userLng) {
                L.circleMarker([userLat, userLng], { radius: 8, color: '#E8543A', fillColor: '#E8543A', fillOpacity: 0.8 }).addTo(markersLayer).bindPopup('Konumunuz');
            }
        }

        // Kuş uçuşu km yerine gerçek araçla sürüş süresini gösterir (ücretsiz OSRM
        // servisi ile). Performans için sadece en yakın 12 sonuç için, ve sayfa
        // ilk açıldıktan SONRA (progressive enhancement) - km bilgisi hep anında
        // görünür, süre bilgisi birkaç saniye içinde üzerine yazılır.
        async function enhanceWithRealTravelTime(closestResults) {
            for (const r of closestResults) {
                if (!r.lat || !r.lng) continue;
                const el = document.getElementById(`dist-${r.id}`);
                if (!el) continue;
                try {
                    const url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${r.lng},${r.lat}?overview=false`;
                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.routes && data.routes[0]) {
                        const minutes = Math.round(data.routes[0].duration / 60);
                        el.textContent = `🚗 ${minutes} dk (araçla) · 📏 ${r._dist.toFixed(1)} km`;
                    }
                } catch (e) { /* OSRM'e ulaşılamazsa km bilgisi zaten görünür durumda kalır */ }
            }
        }

        renderCategoryChips();
        initMap();
        loadResults();
    </script>
    <footer class="w-full border-t border-slate-200/80 px-4 sm:px-6 py-6 mt-8 text-center">
        <p class="text-xs text-brandGray">
            © 2026 EduScor · <a href="gizlilik-politikasi.html" class="underline hover:text-brandRed">Gizlilik Politikası</a>
        </p>
    </footer>

</body>
</html>
