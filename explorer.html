<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduScor | Global Education Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#FDF8F5] text-[#241A16] min-h-screen flex flex-col overflow-hidden">

    <!-- Üst Menü: Dil butonu ve giriş alanını iyice sağa yaslamak için sağ taraftan (pr-4 sm:pr-12) ekstra boşluk açıldı -->
    <header class="w-full bg-white border-b border-slate-200 pl-4 pr-4 sm:pl-8 sm:pr-12 py-4 flex justify-between items-center shrink-0 z-10">
        <span class="text-xl font-bold text-[#E8543A]">EduScor</span>
        <!-- Sağ taraftaki menü elemanları arasına boşluk (gap-8) verilerek dil değişimi için pay açıldı -->
        <div class="flex items-center gap-8 text-sm font-semibold">
            <a href="index.html" class="text-[#8A7A72] hover:text-[#241A16] transition-colors">🏠 Ana Sayfa</a>
            <button class="px-4 py-1.5 bg-[#241A16] text-white hover:bg-[#E8543A] rounded-full transition-all text-xs">Giriş Yap</button>
        </div>
    </header>

    <!-- Ana İçerik Konteynırı -->
    <div class="flex-grow flex w-full h-full relative overflow-hidden">

        <!-- SOL SÜTUN (Liste) -->
        <main id="listContainer" class="w-full md:w-[60%] h-full overflow-y-auto p-4 md:p-6 bg-[#FDF8F5]">
            <!-- Arama Barı -->
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm mb-4 flex flex-col gap-2">
                <div class="flex gap-2">
                    <input type="text" id="searchInput" class="w-full bg-transparent outline-none text-sm" placeholder="Kurum arayın...">
                    <button id="updateBtn" class="bg-[#E8543A] text-white px-4 py-1.5 rounded-lg text-xs font-bold">Ara</button>
                </div>
            </div>

            <div id="categoryChips" class="flex flex-wrap gap-2 mb-6"></div>
            <h2 id="resultsTitle" class="text-xs font-bold text-[#8A7A72] uppercase mb-4">Yükleniyor...</h2>
            
            <!-- Sonuç Listesi -->
            <div id="resultsList" class="space-y-4"></div>
            
            <div id="emptyState" class="hidden bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center">
                <p class="font-semibold">Sonuç bulunamadı</p>
                <p class="text-xs text-[#8A7A72]">Veritabanımız küresel ölçekte genişliyor, lütfen tekrar deneyin.</p>
            </div>
        </main>

        <!-- SAĞ SÜTUN (Harita) -->
        <aside id="mapContainer" class="hidden md:flex w-[40%] h-full border-l border-slate-200 bg-white">
            <div id="map" class="w-full h-full"></div>
        </aside>

    </div>

    <!-- Mobil Buton -->
    <button id="mobileToggleBtn" onclick="toggleMobileMap()" class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[9999] bg-[#241A16] text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm">
        📍 Haritayı Göster
    </button>

    <script>
        const sb = supabase.createClient("https://piyxmmzteyygwlurdawi.supabase.co", "sb_publishable_6WIxgR9-dgumpgAFgZtn5A_iuBG8llL");
        let map, markersLayer, isMobileMap = false;

        function initMap() {
            map = L.map('map').setView([39.90, 32.65], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            markersLayer = L.layerGroup().addTo(map);
        }

        function toggleMobileMap() {
            const list = document.getElementById('listContainer');
            const mapC = document.getElementById('mapContainer');
            const btn = document.getElementById('mobileToggleBtn');
            
            isMobileMap = !isMobileMap;
            if(isMobileMap) {
                list.classList.add('hidden');
                mapC.classList.remove('hidden');
                mapC.style.display = 'block';
                btn.textContent = '📋 Listeyi Göster';
                map.invalidateSize();
            } else {
                list.classList.remove('hidden');
                mapC.classList.add('hidden');
                btn.textContent = '📍 Haritayı Göster';
            }
        }

        // Görselin mobilde sağdan soldan kırpılmasını önleyen dinamik fonksiyon
        function renderCardHTML(r) {
            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-col sm:flex-row gap-4">
                    <!-- Görsel Alanı: Mobilde h-auto ve aspect-video ile object-contain getirilerek kırpılma tamamen engellendi -->
                    <div class="w-full sm:w-32 h-auto aspect-video sm:aspect-auto sm:h-24 bg-slate-50 rounded-xl flex items-center justify-center shrink-0 border border-slate-200/60 overflow-hidden">
                        <img src="students.jpg" alt="${r.name}" class="w-full h-full object-contain sm:object-cover object-center" onerror="this.outerHTML='<span class="text-2xl">🏫</span>'">
                    </div>
                    <div class="flex-grow flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-base text-[#241A16]">${r.name}</h3>
                            <p class="text-xs text-[#8A7A72] mt-1">${r.address || 'Ankara'}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadResults() {
            let query = sb.from('institutions').select(`*, institution_types(name_tr), categories(slug), locations(name)`);
            const { data } = await query;
            
            document.getElementById('resultsTitle').textContent = `Arama Sonuçları (${data?.length || 0} kurum)`;
            
            const listEl = document.getElementById('resultsList');
            if (data && data.length > 0) {
                listEl.innerHTML = data.map(renderCardHTML).join('');
            } else {
                listEl.innerHTML = '';
            }
            
            markersLayer.clearLayers();
            data?.forEach(r => { if(r.lat && r.lng) L.marker([r.lat, r.lng]).addTo(markersLayer); });
        }

        initMap();
        loadResults();
    </script>
</body>
</html>
