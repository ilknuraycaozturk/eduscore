<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduScor | Kayıt Ol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: {
            brandRed: '#E8543A', brandRedDark: '#CC3F28', brandDark: '#241A16', brandGray: '#8A7A72', brandBg: '#FDF8F5'
        } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
        <style>
        .eduscor-nav-container { max-width:1280px; margin:0 auto; padding:20px 40px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .eduscor-logo { font-size:26px; font-weight:800; letter-spacing:-0.5px; color:#3D2D27; text-decoration:none; display:inline-flex; align-items:center; }
        .eduscor-logo span { color:#E8543A; }
        .nav-link { text-decoration:none; color:#3D2D27; font-weight:500; font-size:15px; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); position:relative; }
        .nav-link:hover, .nav-link.active { color:#E8543A; }
        .nav-link::after { content:''; position:absolute; bottom:-6px; left:0; width:0; height:2px; background-color:#E8543A; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); border-radius:2px; }
        .nav-link:hover::after, .nav-link.active::after { width:100%; }
    </style>
    <script src="i18n.js?v=5"></script>
</head>
<body class="bg-brandBg text-brandDark min-h-screen">

    <header class="w-full bg-white/95 backdrop-blur-md border-b border-slate-200/80 fixed top-0 left-0 z-50">
<div class="eduscor-nav-container">

        <a href="index.html" class="eduscor-logo">Edu<span>Scor</span></a>
        <a href="giris.html" class="nav-link" data-i18n="nav_zaten_hesabim_var">Zaten hesabım var</a>
    <button id="langToggleBtn" onclick="toggleLang()" style="border:1px solid #ddd;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;background:white;flex-shrink:0;">EN</button></div></header>

    <main class="max-w-sm mx-auto px-4 py-16" style="margin-top:88px;">
        <h1 class="text-2xl font-bold text-brandDark mb-2 text-center" data-i18n="h1_kayit">Kayıt Ol</h1>
        <p class="text-sm text-brandGray text-center mb-8">Favorilerinizi kaydedin, yorum yapın, okulunuzu sahiplenin.</p>

        <form id="signupForm" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
            <div>
                <label class="text-xs font-semibold text-brandGray">Ad Soyad</label>
                <input type="text" id="fullName" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-brandRed">
            </div>
            <div>
                <label class="text-xs font-semibold text-brandGray">E-posta</label>
                <input type="email" id="email" required class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-brandRed">
            </div>
            <div>
                <label class="text-xs font-semibold text-brandGray">Şifre (en az 6 karakter)</label>
                <input type="password" id="password" required minlength="6" class="w-full mt-1 px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:border-brandRed">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-brandRed hover:bg-brandRedDark text-white font-semibold py-2.5 rounded-full text-sm transition-all">
                Kayıt Ol
            </button>
            <p id="messageBox" class="hidden text-xs text-center rounded-lg p-2"></p>
        </form>
    </main>

    <footer style="width:100%; border-top:1px solid #F3EFEA; padding:24px 16px; margin-top:8px; text-align:center;">
        <nav style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px 20px; margin-bottom:12px;">
            <a href="index.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_home">Ana Sayfa</a>
            <a href="nasil-calisir.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_how">Nasıl Çalışır?</a>
            <a href="metodoloji.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_methodology">Metodoloji</a>
            <a href="edunode.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_edunode">EduNode</a>
            <a href="giris.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_giris_yap">Giriş Yap</a>
            <a href="kurumlar-icin.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_for_institutions">Okulunuzu Sahiplenin</a>
            <a href="explorer.html" style="font-size:12px; color:#8A7A72; text-decoration:none;" data-i18n="nav_explorer">Platformu Keşfet</a>
            <button onclick="toggleLang()" style="font-size:12px; color:#8A7A72; background:none; border:none; cursor:pointer; padding:0;" id="footerLangBtn">TR</button>
        </nav>
        <p style="font-size:11px; color:#8A7A72; margin:0; text-align:center;">
            © 2026 EduScor · <a href="gizlilik-politikasi.html" style="color:#8A7A72; text-decoration:underline;">Gizlilik Politikası</a>
        </p>
    </footer>

    <script>
        const sb = supabase.createClient("https://piyxmmzteyygwlurdawi.supabase.co", "sb_publishable_6WIxgR9-dgumpgAFgZtn5A_iuBG8llL");

        function showMessage(text, isError) {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `text-xs text-center rounded-lg p-2 ${isError ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}`;
            box.classList.remove('hidden');
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'İşleniyor...';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await sb.auth.signUp({
                email, password,
                options: { data: { full_name: fullName } }
            });

            if (error) {
                showMessage(error.message, true);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kayıt Ol';
                return;
            }

            if (data.user) {
                await sb.from('profiles').insert({ id: data.user.id, full_name: fullName });
            }

            showMessage('Kayıt başarılı! E-postanızı kontrol edip hesabınızı onaylayın, sonra giriş yapabilirsiniz.', false);
            submitBtn.textContent = 'Kayıt Ol';
        });
    </script>
</body>
</html>
